# Windows kurulum paketini GitHub'da derler ve Release olarak yayinlar.
#
# Neden: uygulamanin otomatik guncellemesi GitHub Releases'teki son surume
# bakiyor (updater.py -> GITHUB_LATEST_RELEASE). Yani buraya bir surum
# dusturuldugu anda herkesin uygulamasi kendini gunceller. Boylece artik
# kimsenin kendi bilgisayarinda derleme yapmasi gerekmiyor.
#
# Calistirma: ya "v1.3.1" gibi bir etiket push edin, ya da Actions
# sekmesinden "Run workflow" deyip surumu yazin.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Surum (ornek: 1.3.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Surumu belirle
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v?', ''
          } else {
            $v = '${{ inputs.version }}'.TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw "Gecersiz surum: '$v' (ornek: 1.3.1)"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Surum: $v"

      - name: Surum numarasini dosyalara yaz
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          # Tek dogruluk kaynagi etiket olsun; iki dosyanin elle guncellenmesi
          # unutuldugunda otomatik guncelleme sessizce bozuluyordu.
          (Get-Content updater.py -Raw) -replace '(?m)^APP_VERSION = ".*"', "APP_VERSION = `"$v`"" |
            Set-Content updater.py -Encoding utf8 -NoNewline
          (Get-Content installer.iss -Raw) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$v`"" |
            Set-Content installer.iss -Encoding utf8 -NoNewline
          Select-String -Path updater.py -Pattern '^APP_VERSION'
          Select-String -Path installer.iss -Pattern 'MyAppVersion'

      - name: Python bagimliliklari
        run: >
          python -m pip install --upgrade pip pyinstaller "pywebview>=5.3"
          pystray pillow flask flask-cors yt-dlp "curl_cffi>=0.7.4"

      - name: ffmpeg onbellegi
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-win64-gpl-shared-v1

      - name: ffmpeg indir
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $root = Get-ChildItem ffmpeg-tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          # app.py duz bir klasor bekliyor: ffmpeg\ffmpeg.exe
          Copy-Item "$($root.FullName)\bin\*" ffmpeg\
          Remove-Item ffmpeg\ffplay.exe -ErrorAction SilentlyContinue
          Get-ChildItem ffmpeg | Select-Object -First 5 Name

      - name: Uygulamayi derle
        run: python -m PyInstaller "Video Downloader.spec" --clean --noconfirm

      - name: curl_cffi paketlendi mi
        shell: pwsh
        run: |
          # TikTok/Instagram impersonation'i bu pakete bagli; sessizce
          # dusup kullaniciya "giris gerekiyor" demesin diye burada dogrula.
          $hit = Get-ChildItem "dist\Video Downloader\_internal" -Recurse -Filter "*curl_cffi*" -ErrorAction SilentlyContinue
          if (-not $hit) { throw "curl_cffi pakete girmemis!" }
          Write-Host "curl_cffi tamam: $($hit[0].FullName)"

      - name: ffmpeg'i pakete kopyala
        shell: pwsh
        run: Copy-Item ffmpeg "dist\Video Downloader\ffmpeg" -Recurse

      - name: Inno Setup kur
        run: choco install innosetup -y --no-progress

      - name: Kurulum paketini olustur
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q installer.iss
          if (-not (Test-Path "dist\Video Downloader Kurulum.exe")) {
            throw "Kurulum dosyasi olusmadi"
          }

      - name: Release yayinla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $notes = "Otomatik derleme. Uygulamayi kurup acin; sonraki surumler kendiliginden gelecek."
          # Ayni etiket icin release varsa dosyayi guncelle, yoksa olustur.
          $exists = gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" "dist\Video Downloader Kurulum.exe" --clobber
          } else {
            gh release create "v$v" "dist\Video Downloader Kurulum.exe" `
              --title "v$v" --notes $notes --latest
          }

      - name: Kurulum dosyasini is ciktisi olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Kurulum-${{ steps.ver.outputs.version }}
          path: dist/Video Downloader Kurulum.exe
